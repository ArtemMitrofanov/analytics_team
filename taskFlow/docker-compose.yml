version: '3.8'

services:
  taskflow-analytics:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=false
    restart: unless-stopped

  taskflow-dev:
    build: .
    ports:
      - "5001:5000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./src:/app/src
      - ./frontend:/app/frontend
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=true
    command: python src/main.py --mode server --debug
    profiles:
      - dev